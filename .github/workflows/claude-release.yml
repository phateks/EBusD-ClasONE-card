name: Claude Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versiune (ex: v1.0.3)"
        required: true

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      INPUT_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Normalize version
        run: |
          V="${INPUT_VERSION#v}"
          if ! [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Versiune invalida: $INPUT_VERSION (format asteptat: v1.2.3)"; exit 1
          fi
          if git rev-parse "v$V" >/dev/null 2>&1; then
            echo "Tag-ul v$V exista deja"; exit 1
          fi
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "TAG=v$V" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bump version (package.json, package-lock.json, src/types.ts)
        run: |
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          sed -i -E "s/export const CARD_VERSION = \"[^\"]*\";/export const CARD_VERSION = \"$VERSION\";/" src/types.ts
          grep -q "CARD_VERSION = \"$VERSION\"" src/types.ts

      - name: Build card
        run: |
          npm run build
          grep -q "$VERSION" ebusd-clasone-card.js

      - name: Claude writes changelog and release notes
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.CLAUDE_RELEASE }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Pregătim release-ul ${{ env.TAG }} pentru un card Lovelace Home Assistant (distribuit prin HACS).
            Versiunea și build-ul sunt deja făcute. NU modifica alte fișiere în afară de cele două de mai jos,
            NU face commit, tag sau push.

            1. Găsește ultimul tag (`git describe --tags --abbrev=0`). Dacă nu există niciun tag,
               folosește tot istoricul. Citește commit-urile de atunci (`git log`).
            2. Actualizează CHANGELOG.md (creează-l dacă nu există, format Keep a Changelog):
               adaugă sus secțiunea `## [${{ env.VERSION }}] - <data de azi>` cu Added / Changed / Fixed.
            3. Scrie RELEASE_NOTES.md în engleză, pentru utilizatori: rezumat scurt al schimbărilor,
               grupat pe Features / Fixes / Breaking changes (omite grupurile goale),
               plus o secțiune scurtă "Installation" (HACS → Frontend → Custom repositories,
               sau manual: copiază ebusd-clasone-card.js în /config/www și adaugă resursa
               /local/ebusd-clasone-card.js ca JavaScript Module).
          claude_args: >-
            --allowedTools "Bash(git log:*),Bash(git describe:*),Bash(git tag:*),Bash(git diff:*),Read,Edit,Write"

      - name: Commit, tag and push
        run: |
          test -f RELEASE_NOTES.md
          git add package.json package-lock.json src/types.ts ebusd-clasone-card.js CHANGELOG.md
          git commit -m "Release $TAG"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin HEAD
          git push origin "$TAG"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG" ebusd-clasone-card.js \
            --title "$TAG" \
            --notes-file RELEASE_NOTES.md
