name: Claude Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versiune (ex: v1.4.0)"
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          anthropic_api_key: ${{ secrets.CLAUDE_RELEASE }}
          prompt: |
            Pregătește release-ul ${{ inputs.version }}:
            1. Găsește ultimul tag și citește commit-urile de atunci.
            2. Actualizează CHANGELOG.md (creează-l dacă nu există) și versiunea din proiect, apoi fă commit.
            3. Creează tag-ul și fă push.
            4. Rulează `gh release create ${{ inputs.version }}` cu release notes grupate
               (Features / Fixes / Breaking changes).
          claude_args: >-
            --allowedTools "Bash(git:*),Bash(gh release:*),Edit,Read,Write"
